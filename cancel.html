<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrepKit — Payment Cancelled</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3d;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
    }

    .logo { font-size: 1.25rem; font-weight: 700; color: var(--accent-light); }
    .logo span { color: var(--text); }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 440px;
      width: 100%;
    }

    .icon { font-size: 3rem; margin-bottom: 1rem; }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 1.5rem;
    }

    a {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 2rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: background 0.15s;
    }

    a:hover { background: #4f52d8; }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.75rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <span class="logo">Prep<span>Kit</span></span>
</header>

<main>
  <div class="card">
    <div class="icon">↩</div>
    <h1>Payment cancelled</h1>
    <p>No charge was made. Your interview prep kit is waiting whenever you're ready.</p>
    <a href="/">Back to PrepKit</a>
  </div>
</main>

<footer>
  &copy; 2026 PrepKit · Built with Claude AI · Payments secured by Stripe
</footer>

</body>
</html>
